name: Nöbet listesini güncelle ve yayınla

on:
  schedule:
    # Her saat :17'de bakar (GitHub saat başlarındaki işleri sık sık geciktiriyor ya da atlıyor).
    # API'yi yalnızca iki kez çağırır: gece yarısından sonraki ilk çalışmada (yeni günün listesi)
    # ve 17:00'den sonraki ilk çalışmada (nöbet 19:00'da başlamadan son dakika değişiklikleri).
    # Biri atlanırsa bir saat sonraki çalışma telafi eder.
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Bugün çekilmiş olsa bile API’den tekrar iste'
        type: boolean
        default: false
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: nobetci
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.decide.outputs.publish }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Nöbet listesini çek
        if: github.event_name != 'push'
        run: node scripts/fetch.mjs
        env:
          ECZANEAPI_KEY: ${{ secrets.ECZANEAPI_KEY }}
          CITIES: ${{ vars.CITIES || 'istanbul' }}
          FORCE: ${{ inputs.force && '1' || '' }}

      - name: Veriyi repoya kaydet
        id: save
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Değişiklik yok."
          else
            git commit -m "Nöbet listesi $(TZ=Europe/Istanbul date +'%Y-%m-%d %H:%M')"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Saatlik kontrolde değişiklik yoksa yayınlamaya gerek yok.
      - name: Yayınlansın mı?
        id: decide
        run: echo "publish=${{ github.event_name != 'schedule' || steps.save.outputs.changed == 'true' }}" >> "$GITHUB_OUTPUT"

      - name: Siteyi hazırla
        if: steps.decide.outputs.publish == 'true'
        run: |
          mkdir -p _site
          cp index.html manifest.webmanifest sw.js _site/
          cp -r icons data _site/

      - if: steps.decide.outputs.publish == 'true'
        uses: actions/configure-pages@v5
      - if: steps.decide.outputs.publish == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  # Ayrı iş: yayınlama, yüklenen dosya GitHub'da görünür olduktan sonra başlar.
  # Yine de bulamazsa 30 sn bekleyip bir kez daha dener.
  deploy:
    needs: build
    if: needs.build.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url || steps.retry.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - if: steps.deploy.outcome == 'failure'
        run: sleep 30
      - id: retry
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v4
